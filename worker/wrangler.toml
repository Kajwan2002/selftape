name = "selftape-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Track list + playlists (audio files themselves live in Telegram).
[[d1_databases]]
binding = "DB"
database_name = "selftape"
database_id = "7ddd6f58-3161-4f1c-9cf7-cc956d59a958"

# Only the Selftape app may call the API (its own address, plus the old GitHub one).
[vars]
ALLOWED_ORIGIN = "https://selftape.selftape-api.workers.dev,https://kajwan2002.github.io"
